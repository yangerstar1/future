name: Glasshouse tool readiness
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [.github/workflows/glasshouse-tools.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glasshouse-tools
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned official tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tool-probe
          bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee evidence/tool-probe/provision.log
      - name: Save and render actual technical scene
        run: blender -b --factory-startup -t 4 -P workspaces/glasshouse-terminus/tool_probe.py 2>&1 | tee evidence/tool-probe/render.log
      - name: Reopen the saved file in a separate process
        run: |
          blender -b evidence/tool-probe/diagnostic.blend -t 4 -o //reopened- -f 1 2>&1 | tee evidence/tool-probe/reopen.log
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence/tool-probe');a=p/'diagnostic.png';b=p/'reopened-0001.png'
          assert a.is_file() and b.is_file()
          result={'fresh_process':True,'original_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'reopened_sha256':hashlib.sha256(b.read_bytes()).hexdigest()}
          result['pixel_file_equal']=result['original_sha256']==result['reopened_sha256']
          (p/'cold-start.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Probe actual browser with bounded process lifetime
        timeout-minutes: 3
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.57.0
          export PW_ROOT="$RUNNER_TEMP/pw"
          timeout 60s node <<'JS'
          const {chromium}=require(process.env.PW_ROOT+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,timeout:20000,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try {
              const page=await browser.newPage({viewport:{width:640,height:360}});
              await page.setContent('<canvas id="c" width="640" height="360"></canvas>');
              const result=await page.evaluate(()=>{const g=document.querySelector('canvas').getContext('webgl2');if(!g)return {webgl2:false};const d=g.getExtension('WEBGL_debug_renderer_info');g.clearColor(.12,.18,.22,1);g.clear(g.COLOR_BUFFER_BIT);return {webgl2:true,renderer:d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER)};});
              result.browser=browser.version();result.scope='TECHNICAL PROBE ONLY';
              fs.writeFileSync('evidence/tool-probe/browser.json',JSON.stringify(result,null,2));
              await page.screenshot({path:'evidence/tool-probe/browser.png'});
              if(!result.webgl2)throw new Error('WebGL2 unavailable');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 30s xvfb-run -a glxinfo -B > evidence/tool-probe/opengl.txt
          ffmpeg -version > evidence/tool-probe/ffmpeg.txt
      - name: Persist evidence separately from source
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/tools-${GITHUB_RUN_ID}
          git add evidence/tool-probe
          git diff --staged --quiet || git commit -m "evidence: actual tools ${GITHUB_RUN_ID}; not art acceptance"
          git push origin HEAD
      - name: Check small review-transfer size
        if: always()
        run: test "$(du -sb evidence/tool-probe | cut -f1)" -lt 10000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-probe-${{ github.run_id }}
          path: evidence/tool-probe
          retention-days: 1
          if-no-files-found: error
