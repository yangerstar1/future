name: Skyfold R08B low-opening tracking render
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r08b-opening.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r08b-opening
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r08b-tracking
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore inspected R08 without touching old delivered footage
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 3595317e06dd972e032113a569563afa5e8e6261
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r08-tracking/skyfold-r08.blend workspaces/skyfold-dock/output/r08-tracking/BUILD-MANIFEST.json
          mkdir -p "$SKYFOLD_OUT"
          python3 -m py_compile workspaces/skyfold-dock/r08b_opening_track.py workspaces/skyfold-dock/r08_inhabited_tracking.py
          { date -u; git rev-parse HEAD; free -b; df -B1 .; } > "$SKYFOLD_OUT/environment.txt"
          sha256sum workspaces/skyfold-dock/{r08b_opening_track.py,r08_inhabited_tracking.py,r06_flight.py,provision.sh} > "$SKYFOLD_OUT/source-sha256.txt"
          bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Correct flat-strip projection and save editable scene
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r08-tracking/skyfold-r08.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r08b_opening_track.py > "$SKYFOLD_OUT/build.log" 2>&1
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r08b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r08b-tracking
          git commit -m "R08B opening-view source; no visual gate promotion"
          git push origin HEAD
      - name: Native 2560 hero 1920 middle and neutral inspection
        run: |
          set -euo pipefail
          R08_MODE=hero /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r08b.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r08_inhabited_tracking.py > "$SKYFOLD_OUT/render.log" 2>&1
          mkdir -p "$SKYFOLD_OUT/tail"
          R08_MODE=motion FRAME_START=192 FRAME_END=192 SKYFOLD_OUT="$SKYFOLD_OUT/tail" blender -b "$SKYFOLD_OUT/skyfold-r08b.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r08_inhabited_tracking.py > "$SKYFOLD_OUT/tail/render.log" 2>&1
      - name: Save bounded real observations and exact failure logs
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT']);files={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          assert sum(r['bytes'] for r in files.values())<100000000
          (p/'DELIVERY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          B=evidence/skyfold-r08b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [ "$(git branch --show-current)" != "$B" ]; then git switch -c "$B"; fi
          git add workspaces/skyfold-dock/output/r08b-tracking
          git diff --cached --quiet || git commit -m "R08B actual native-size render and endpoint evidence"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r08b-tracking-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r08b-tracking
            workspaces/skyfold-dock/r08b_opening_track.py
            workspaces/skyfold-dock/r08_inhabited_tracking.py
            workspaces/skyfold-dock/r06_flight.py
            workspaces/skyfold-dock/provision.sh
          retention-days: 1
          if-no-files-found: error
