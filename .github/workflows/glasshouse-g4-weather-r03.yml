name: Glasshouse G4 R03 actual rain ocean and cliff materials
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [workspaces/glasshouse-terminus/g4-weather-r03-request.json]
permissions:
  contents: write
concurrency:
  group: glasshouse-production
  cancel-in-progress: false
jobs:
  weather-and-materials:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OUT: workspaces/glasshouse-terminus/output/g4-r03-weather
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify explicit project request and restore immutable real R02
        timeout-minutes: 3
        run: |
          echo "G4_WEATHER_DEADLINE=$(( $(date +%s) + 52*60 ))" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import json
          q=json.loads(Path('workspaces/glasshouse-terminus/g4-weather-r03-request.json').read_text())
          assert q['stage']=='G4' and q['max_runs']==1 and q['job_minutes']==60
          assert q['external_spend_usd']==0 and q['g4_stage_pass'] is False
          assert q['parent_evidence_commit']=='12ae1030686d97823548b2967805d85853d12ab2'
          assert q['generated_images_are_evidence'] is False
          print(json.dumps(q,indent=2))
          PY
          git fetch --depth=1 origin 12ae1030686d97823548b2967805d85853d12ab2
          git archive FETCH_HEAD workspaces/glasshouse-terminus/output/g4-r02 | tar -x
          echo '173da1291bff8a39da704539c737e21f9b2d739e3d32a106f629601bc2abefdc  workspaces/glasshouse-terminus/output/g4-r02/g4-full-scene-candidate.blend' | sha256sum --check
          mkdir -p "$OUT"
          python3 -m py_compile workspaces/glasshouse-terminus/enhance_g4_weather_r03.py workspaces/glasshouse-terminus/execute_g4_weather_r03.py workspaces/glasshouse-terminus/fetch_g4_rock_reference.py
      - name: Reuse pinned official Blender and original packed scene assets
        timeout-minutes: 5
        run: bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee "$OUT/provision.log"
      - name: Reuse one verified official CC0 rock texture family
        timeout-minutes: 4
        continue-on-error: true
        run: python3 workspaces/glasshouse-terminus/fetch_g4_rock_reference.py 2>&1 | tee "$OUT/rock-asset-fetch.log"
      - name: Inspect real geometry and build only the authorized weather/material candidate
        timeout-minutes: 10
        env:
          G4_WEATHER_MODE: build
        run: |
          blender -b workspaces/glasshouse-terminus/output/g4-r02/g4-full-scene-candidate.blend -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/execute_g4_weather_r03.py 2>&1 | tee "$OUT/build.log"
          test "$(du -sb workspaces/glasshouse-terminus | cut -f1)" -lt 8000000000
          bash workspaces/glasshouse-terminus/publish_evidence.sh "$OUT" g4-r03-weather-source
      - name: Fresh-process real hall rain and full ocean cliff views
        timeout-minutes: 22
        env:
          G4_WEATHER_MODE: overview
        run: |
          remaining=$((G4_WEATHER_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-weather-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/execute_g4_weather_r03.py 2>&1 | tee "$OUT/overview.log"
      - name: Early native overview evidence, never generated concept art
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-r03-weather-overview-${{ github.run_id }}
          path: |
            workspaces/glasshouse-terminus/output/g4-r03-weather/C03-rain-hall.png
            workspaces/glasshouse-terminus/output/g4-r03-weather/C01-rain-ocean-cliff.png
            workspaces/glasshouse-terminus/output/g4-r03-weather/build-report.json
            workspaces/glasshouse-terminus/output/g4-r03-weather/render-metrics.json
          retention-days: 1
          if-no-files-found: error
      - name: Fresh-process ocean rock glass detail and protected original node view
        timeout-minutes: 22
        env:
          G4_WEATHER_MODE: details
        run: |
          remaining=$((G4_WEATHER_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-weather-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/execute_g4_weather_r03.py 2>&1 | tee "$OUT/details.log"
      - name: Native short ocean rain timeline witness, not final movie
        timeout-minutes: 10
        env:
          G4_WEATHER_MODE: motion
        run: |
          remaining=$((G4_WEATHER_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-weather-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/execute_g4_weather_r03.py 2>&1 | tee "$OUT/motion.log"
          ffmpeg -hide_banner -loglevel error -framerate 10 -i "$OUT/motion/frame-%03d.png" -c:v libx264 -crf 18 -pix_fmt yuv420p "$OUT/native-ocean-rain-1.6s-witness.mp4"
      - name: Persist actual editable source and truthful coverage even on failure
        if: always()
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['OUT']);root.mkdir(parents=True,exist_ok=True)
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file() and p.name!='DELIVERY.json'}
          assert sum(v['bytes'] for v in files.values())<80000000,'Evidence budget exceeded; preserve source and report explicitly'
          required=['g4-weather-scene-candidate.blend','READ-ONLY-SOURCE-INVENTORY.json','build-report.json','C03-rain-hall.png','C01-rain-ocean-cliff.png','D-ocean-waves-foam.png','D-cliff-geology.png','D-wet-glass.png','D01-roof-node-regression.png','reopen-overview.json','reopen-details.json','reopen-motion.json','native-ocean-rain-1.6s-witness.mp4']
          missing=[n for n in required if not (root/n).is_file()]
          (root/'DELIVERY.json').write_text(json.dumps({'stage':'G4','revision':'R03_WEATHER','status':'NATIVE_EVIDENCE_PENDING_ACTUAL_IMAGE_REVIEW' if not missing else 'PARTIAL_OR_FAILED_NOT_A_PASS','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'parent_evidence_commit':'12ae1030686d97823548b2967805d85853d12ab2','parent_master_sha256':'173da1291bff8a39da704539c737e21f9b2d739e3d32a106f629601bc2abefdc','files':files,'missing':missing,'g3_historical_pass':False,'g4_stage_pass':False,'human_acceptance':False,'generated_images_are_evidence':False,'browser_gate':'BLOCKED_UNCHANGED','source_scope':'Real saved Blender Ocean/GN rain/rock geometry and materials; no concept images included. The short witness is not the final 4K film.'},indent=2))
          PY
          bash workspaces/glasshouse-terminus/publish_evidence.sh "$OUT" g4-r03-weather
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g4-r03-weather-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g4-r03-weather
          retention-days: 1
          if-no-files-found: error
