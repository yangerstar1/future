name: Skyfold R05B independent city foundations
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r05b-city.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: skyfold-r05-city
  cancel-in-progress: false
jobs:
  city:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r05b-city
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify previous city job is finished and restore exact R05
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SKYFOLD_OUT"
          gh api repos/yangerstar1/future/actions/jobs/102994763349 > "$SKYFOLD_OUT/previous-job.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['SKYFOLD_OUT'])/'previous-job.json').read_text())
          assert j['status']=='completed' and j['conclusion']=='success'
          assert j['head_sha']=='3606690a1302b7925e2432c0f2fffb96b7d37ecf'
          PY
          git fetch --depth=1 origin 99e13a9a9a86627fa640196c700016c4048daac5
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r05-city
          python3 -m py_compile workspaces/skyfold-dock/revise_r05b_city.py workspaces/skyfold-dock/render_r05_city.py
          (date -u; free -b; df -B1 .; sha256sum workspaces/skyfold-dock/revise_r05b_city.py workspaces/skyfold-dock/render_r05_city.py) > "$SKYFOLD_OUT/environment.txt"
          python3 - <<'PY'
          import json,hashlib,shutil,os
          from pathlib import Path
          root=Path('workspaces/skyfold-dock/output/r05-city');out=Path(os.environ['SKYFOLD_OUT'])
          obs=json.loads((root/'candidate-OBSERVATIONS.json').read_text())[0]
          p=root/obs['file'];assert hashlib.sha256(p.read_bytes()).hexdigest()==obs['sha256']
          assert obs['scene_sha256']=='cf54a7be3f679643ff6abd54ca438389bdf4654c206b53bdebca9205d80249c1'
          shutil.copy2(p,out/'CONTROL_R05_HERO.png')
          (out/'CONTROL-R05-OBSERVATION.json').write_text(json.dumps({'local_file':'CONTROL_R05_HERO.png','original_observation':obs,'operation':'Byte-for-byte copy, no re-render or rescale'},indent=2))
          PY
      - name: Reuse official locked Blender
        run: bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Replace repetitive raised plates and preserve non-city geometry
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r05-city/skyfold-r05.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/revise_r05b_city.py > "$SKYFOLD_OUT/build.log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r05b-city-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r05b-city
          git commit -m "skyfold R05B source ${GITHUB_RUN_ID}; actual ground-contact candidate, not art PASS"
          git push origin HEAD
      - name: Reuse identical camera and render presets in a new Blender process
        env:
          R05_PHASE: candidate
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r05b.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/render_r05_city.py > "$SKYFOLD_OUT/render.log" 2>&1
      - name: Persist successful outputs or precise failure, without gate promotion
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT']);files={}
          for f in p.rglob('*'):
            if f.is_file():
              assert f.stat().st_size<40000000
              files[str(f.relative_to(p))]={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          assert sum(r['bytes'] for r in files.values())<80000000
          (p/'DELIVERY.json').write_text(json.dumps({'candidate':'R05B_INDEPENDENT_CITY_FOUNDATIONS','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':files,'visual_status':'REVIEW_REQUIRED','auto_qualified':False,'new_full_video_rendered':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH=evidence/skyfold-r05b-city-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          [ "$(git branch --show-current)" = "$BRANCH" ] || git switch -c "$BRANCH"
          git add workspaces/skyfold-dock/output/r05b-city
          git diff --staged --quiet || git commit -m "skyfold R05B observations ${GITHUB_RUN_ID}; review required"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r05b-city-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r05b-city
            workspaces/skyfold-dock/output/r05-city/skyfold-r05.blend
            workspaces/skyfold-dock/output/r05-city/BUILD-MANIFEST.json
            workspaces/skyfold-dock/revise_r05b_city.py
            workspaces/skyfold-dock/revise_r05_city.py
            workspaces/skyfold-dock/render_r05_city.py
            workspaces/skyfold-dock/build_scene_r01.py
            workspaces/skyfold-dock/provision.sh
          retention-days: 1
          if-no-files-found: error
