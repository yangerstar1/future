name: TapTap CLI Discovery
on:
  push:
    branches:
      - codex/taptap-liushuxiang-r3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official TapTap CLI
        run: npm i -g @taptap/cli@2026.9.11
      - name: CLI version
        run: taptap-cli --version
      - name: Package management schema
        run: |
          taptap-cli schema package-management --format json | tee /tmp/package-management-schema.json
      - name: Full CLI help
        run: taptap-cli --help | tee /tmp/taptap-cli-help.txt
      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taptap-cli-discovery
          path: |
            /tmp/package-management-schema.json
            /tmp/taptap-cli-help.txt
          if-no-files-found: error
