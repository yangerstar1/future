name: Skyfold R06B refined forward departure probe
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r06b-departure-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r06b-departure-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r06b-flight
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore verified R06 and reuse the locked toolchain
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 3e5c12d3f795cd843571e14b8d73936c7f430ee6
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r06-flight/skyfold-r06.blend workspaces/skyfold-dock/output/r06-flight/BUILD-MANIFEST.json
          echo 'b45e19f934f60c0257bcf28256e470bb15fba23f66f425df9b3832b94290f5fd  workspaces/skyfold-dock/output/r06-flight/skyfold-r06.blend' | sha256sum -c
          mkdir -p "$SKYFOLD_OUT"
          python3 -m py_compile workspaces/skyfold-dock/refine_r06_departure.py workspaces/skyfold-dock/render_r06_departure_check.py
          { date -u; git rev-parse HEAD; free -b; df -B1 .; lscpu; } > "$SKYFOLD_OUT/environment.txt"
          sha256sum workspaces/skyfold-dock/{refine_r06_departure.py,render_r06_departure_check.py,r06_flight.py,provision.sh} > "$SKYFOLD_OUT/source-sha256.txt"
          bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Refine the inspected ship and preserve the new scene
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r06-flight/skyfold-r06.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/refine_r06_departure.py > "$SKYFOLD_OUT/build.log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r06b-flight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r06b-flight
          git commit -m "R06B forward-departure source; probe not reviewed"
          git push origin HEAD
      - name: Render real motion endpoints neutral geometry and 1080p cost sample
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r06.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/render_r06_departure_check.py > "$SKYFOLD_OUT/render.log" 2>&1
      - name: Preserve outputs and failures without passing artistic gates
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT'])
          files={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.glob('*') if f.is_file()}
          assert sum(r['bytes'] for r in files.values())<100000000
          (p/'DELIVERY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          B=evidence/skyfold-r06b-flight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [ "$(git branch --show-current)" != "$B" ]; then git switch -c "$B"; fi
          git add workspaces/skyfold-dock/output/r06b-flight
          git diff --cached --quiet || git commit -m "R06B measured renders and exact logs; review required"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r06b-flight-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r06b-flight
            workspaces/skyfold-dock/refine_r06_departure.py
            workspaces/skyfold-dock/render_r06_departure_check.py
            workspaces/skyfold-dock/r06_flight.py
            workspaces/skyfold-dock/provision.sh
            workspaces/skyfold-dock/R06-INTERVENTION.md
          retention-days: 1
          if-no-files-found: error
