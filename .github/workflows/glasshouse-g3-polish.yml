name: Glasshouse G3 visual polish R04
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [workspaces/glasshouse-terminus/g3-polish-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glasshouse-production
  cancel-in-progress: false
jobs:
  polish:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OUT: workspaces/glasshouse-terminus/output/g3-r04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate visual intent and recover exact R03 master
        timeout-minutes: 3
        run: |
          echo "G3_PRODUCTION_DEADLINE=$(( $(date +%s) + 45*60 ))" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('workspaces/glasshouse-terminus')
          q=json.loads((r/'g3-polish-request.json').read_text())
          assert q['stage']=='G3' and q['revision']=='R04' and q['max_runs']==1
          assert q['external_spend_usd']==0 and q['g4_allowed'] is False
          assert q['parent_evidence_commit']=='22dceca579c272b51767c70c153c540f7defc547'
          assert (r/'G3-R04-INTENT.md').is_file()
          print(json.dumps(q,indent=2))
          PY
          python3 -m py_compile workspaces/glasshouse-terminus/polish_g3.py workspaces/glasshouse-terminus/render_g3_polish.py
          git fetch --depth=1 origin 22dceca579c272b51767c70c153c540f7defc547
          git archive FETCH_HEAD workspaces/glasshouse-terminus/output/g3-r03 | tar -x
          echo 'cb1ae3c8ace74bcbeeaaf51684bf013cba5b7702803f432c91632e4395fadcfe  workspaces/glasshouse-terminus/output/g3-r03/g3-bay-candidate.blend' | sha256sum --check
          mkdir -p "$OUT"
      - name: Reuse pinned Blender without new furniture or texture downloads
        timeout-minutes: 8
        run: bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee "$OUT/provision.log"
      - name: Build candidate from measured bay and identified light cause
        timeout-minutes: 4
        run: |
          blender -b workspaces/glasshouse-terminus/output/g3-r03/g3-bay-candidate.blend -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/polish_g3.py 2>&1 | tee "$OUT/polish.log"
          test $(du -sb workspaces/glasshouse-terminus | cut -f1) -lt 8000000000
      - name: Preserve editable candidate before renders
        timeout-minutes: 3
        run: bash workspaces/glasshouse-terminus/publish_evidence.sh "$OUT" g3-r04-source
      - name: Reopen candidate and render paired overview plus old view
        timeout-minutes: 13
        env:
          G3_POLISH_SET: overview
        run: |
          remaining=$((G3_PRODUCTION_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g3-bay-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/render_g3_polish.py 2>&1 | tee "$OUT/overview.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-r04-overview-${{ github.run_id }}
          path: |
            workspaces/glasshouse-terminus/output/g3-r04/*.png
            workspaces/glasshouse-terminus/output/g3-r04/*.json
          retention-days: 1
          if-no-files-found: error
      - name: Reopen for primary doorway and craft closeups
        timeout-minutes: 17
        env:
          G3_POLISH_SET: core
        run: |
          remaining=$((G3_PRODUCTION_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g3-bay-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/render_g3_polish.py 2>&1 | tee "$OUT/core.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-r04-core-${{ github.run_id }}
          path: |
            workspaces/glasshouse-terminus/output/g3-r04/*.png
            workspaces/glasshouse-terminus/output/g3-r04/*.json
          retention-days: 1
          if-no-files-found: error
      - name: Reopen for reverse details and actual motion-state observations
        timeout-minutes: 17
        env:
          G3_POLISH_SET: proof
        run: |
          remaining=$((G3_PRODUCTION_DEADLINE-$(date +%s))); test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g3-bay-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/render_g3_polish.py 2>&1 | tee "$OUT/proof.log"
      - name: Persist truthful completion and source identity
        if: always()
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['OUT']);root.mkdir(parents=True,exist_ok=True)
          files={}
          for p in root.rglob('*'):
              if p.is_file() and p.name not in ['DELIVERY.json','manifest.json']:
                  b=p.stat().st_size
                  assert b<90000000,str(p)
                  files[str(p.relative_to(root))]={'bytes':b,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          total=sum(v['bytes'] for v in files.values());assert total<180000000
          required=['g3-bay-candidate.blend','polish-report.json','reopen-and-space-check.json','R04-complete-bay-night.png','R04-complete-bay-neutral.png','G3-bay-night.png','D05-unoccluded-interface.png','D01-roof-node.png','D01-glass-metal.png','D02-joinery.png','D03-front.png','D06-plant.png','QA-reverse.png','D05-roller-detail.png','D05-threshold-detail.png','C03-G2-neutral-baseline.png','D05-original-camera.png','QA-door-301.png','QA-door-330.png','QA-door-348.png','QA-route-481.png','QA-route-601.png']
          absent=[n for n in required if not (root/n).is_file()]
          status='CANDIDATE_REVIEW_PENDING_NOT_A_PASS' if not absent else 'PARTIAL_CANDIDATE_NOT_A_PASS'
          (root/'DELIVERY.json').write_text(json.dumps({'stage':'G3','revision':'R04','status':status,'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'parent_evidence_commit':'22dceca579c272b51767c70c153c540f7defc547','parent_master_sha256':'cb1ae3c8ace74bcbeeaaf51684bf013cba5b7702803f432c91632e4395fadcfe','files':files,'total_bytes':total,'missing':absent,'g4_allowed':False,'human_acceptance':False,'browser_gate':'BLOCKED_UNCHANGED'},indent=2))
          PY
          bash workspaces/glasshouse-terminus/publish_evidence.sh "$OUT" g3-r04
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-r04-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g3-r04
          retention-days: 1
          if-no-files-found: error
