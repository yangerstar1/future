name: TapTap H5 Help Discovery
on:
  push:
    branches:
      - codex/taptap-liushuxiang-r3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-h5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i -g @taptap/cli@2026.9.11
      - name: H5 shortcut help
        run: taptap-cli upload-h5-package --help
      - name: Package skill
        run: |
          taptap-cli skills list
          taptap-cli skills read taptap-package-management || true
