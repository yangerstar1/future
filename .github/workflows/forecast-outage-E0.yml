name: Forecast outage - E0 frozen experiment
on:
  push:
    branches: [research/forecast-outage]
    paths:
      - .github/workflows/forecast-outage-E0.yml
      - workspaces/forecast-outage/experiment.py
      - workspaces/forecast-outage/protocol-E0.json
      - workspaces/forecast-outage/requirements-cpu.lock
permissions:
  contents: write
concurrency:
  group: forecast-outage-E0
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [bolt-tiny, chronos2-small, chronos2-synth]
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare evidence directory
        run: mkdir -p workspaces/forecast-outage/evidence/E0/${MODEL}
      - name: Install previously verified official CPU environment
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r workspaces/forecast-outage/requirements-cpu.lock
          python -m pip check
      - name: Execute fixed protocol and preserve all results
        run: |
          set -o pipefail
          python -u workspaces/forecast-outage/experiment.py --model "${MODEL}" 2>&1 | tee workspaces/forecast-outage/evidence/E0/${MODEL}/run.log
      - name: Commit evidence to an isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/forecast-E0-${MODEL}-${GITHUB_RUN_ID}
          git add workspaces/forecast-outage/evidence/E0/${MODEL}
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve E0 ${MODEL} raw evidence ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-E0-${{ matrix.model }}-${{ github.run_id }}
          path: |
            workspaces/forecast-outage/evidence/E0/${{ matrix.model }}
            workspaces/forecast-outage/experiment.py
            workspaces/forecast-outage/protocol-E0.json
            workspaces/forecast-outage/requirements-cpu.lock
          retention-days: 14
          if-no-files-found: error
