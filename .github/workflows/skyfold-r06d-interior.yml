name: Skyfold R06D interior flight comparison
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r06d-interior.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r06d-interior
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r06d-flight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore precise scene and locked tools
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 3e6c69546bc12f89a343c63bb128a5a557611668
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r06c-flight/skyfold-r06.blend workspaces/skyfold-dock/output/r06c-flight/BUILD-MANIFEST.json
          mkdir -p "$SKYFOLD_OUT"
          { date -u; free -b; df -B1 .; git rev-parse HEAD; } > "$SKYFOLD_OUT/environment.txt"
          python3 -m py_compile workspaces/skyfold-dock/r06_interior_track.py
          bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Build and independently render the same geometry from across the ring
        shell: bash
        run: |
          set -euo pipefail
          R06D_MODE=build /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r06c-flight/skyfold-r06.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r06_interior_track.py > "$SKYFOLD_OUT/build.log" 2>&1
          R06D_MODE=probe /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r06.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r06_interior_track.py > "$SKYFOLD_OUT/render.log" 2>&1
      - name: Preserve bounded source renders and failure logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT']);files={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.glob('*') if f.is_file()}
          assert sum(r['bytes'] for r in files.values())<100000000
          (p/'DELIVERY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r06d-flight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r06d-flight
          git commit -m "R06D cross-ring flight study: actual outputs, no art promotion"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r06d-flight-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r06d-flight
            workspaces/skyfold-dock/r06_interior_track.py
            workspaces/skyfold-dock/r06_flight.py
            workspaces/skyfold-dock/provision.sh
          retention-days: 1
          if-no-files-found: error
