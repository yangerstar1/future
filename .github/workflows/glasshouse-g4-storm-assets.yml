name: Glasshouse G4 storm assets and native Ocean preflight
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [.github/workflows/glasshouse-g4-storm-assets.yml]
permissions:
  contents: write
concurrency:
  group: glasshouse-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      OUT: workspaces/glasshouse-terminus/output/g4-storm-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact R02 and record finite zero-spend request
        timeout-minutes: 2
        run: |
          git fetch --depth=1 origin 12ae1030686d97823548b2967805d85853d12ab2
          git archive FETCH_HEAD workspaces/glasshouse-terminus/output/g4-r02 | tar -x
          echo '173da1291bff8a39da704539c737e21f9b2d739e3d32a106f629601bc2abefdc  workspaces/glasshouse-terminus/output/g4-r02/g4-full-scene-candidate.blend' | sha256sum --check
          mkdir -p "$OUT"
          printf 'User requests actual project rain, premium materials, real sea and rocks; generated images excluded. One asset/probe run15min, asset downloads180MB, total downloads1.5GB, working disk8GB, evidence200MB, external spend0, standard runner, no source save or G5 acceptance.\n' > "$OUT/FINITE-REQUEST.txt"
          python3 -m py_compile workspaces/glasshouse-terminus/prepare_g4_storm_assets.py workspaces/glasshouse-terminus/probe_g4_storm_assets.py
      - name: Reuse two selected CC0 assets through observed official metadata
        timeout-minutes: 5
        run: python3 workspaces/glasshouse-terminus/prepare_g4_storm_assets.py 2>&1 | tee "$OUT/asset-download.log"
      - name: Reuse pinned official Blender
        timeout-minutes: 5
        run: bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee "$OUT/provision.log"
      - name: Actual imported scan and native modifier inspection
        timeout-minutes: 3
        run: blender -b workspaces/glasshouse-terminus/output/g4-r02/g4-full-scene-candidate.blend -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/probe_g4_storm_assets.py 2>&1 | tee "$OUT/probe.log"
      - name: Persist asset bytes and inspection without modifying production master
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']);root.mkdir(parents=True,exist_ok=True)
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file() and p.name!='DELIVERY.json'}
          assert sum(r['bytes'] for r in files.values())<200000000
          assert all(r['bytes']<98000000 for r in files.values())
          (root/'DELIVERY.json').write_text(json.dumps({'stage':'G4_ASSET_PREFLIGHT','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':files,'complete':(root/'ASSET-AND-API-PROBE.json').exists(),'not_project_render':True,'human_acceptance':False},indent=2))
          PY
          bash workspaces/glasshouse-terminus/publish_evidence.sh "$OUT" g4-storm-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g4-storm-assets-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g4-storm-assets
          retention-days: 1
          if-no-files-found: error
