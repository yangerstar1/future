name: Skyfold R08B low-axial context regression
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r08-context.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r08-context
  cancel-in-progress: false
jobs:
  context:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r08b-context
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore inspected R08 and the same renderer
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6cf46e7391357341916c073f9359db5fc583a8b7
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r08-context/skyfold-r08.blend workspaces/skyfold-dock/output/r08-context/BUILD-MANIFEST.json
          echo '2636f1582b1bdbd0d60ab08428f29f8ccc85b27aa2c52086832876aa30eaa6e4  workspaces/skyfold-dock/output/r08-context/skyfold-r08.blend' | sha256sum -c
          mkdir -p "$SKYFOLD_OUT"
          python3 -m py_compile workspaces/skyfold-dock/r08_refine_frame.py
          { date -u; git rev-parse HEAD; free -b; df -B1 .; } > "$SKYFOLD_OUT/environment.txt"
          sha256sum workspaces/skyfold-dock/{r08_refine_frame.py,r06_flight.py,provision.sh} > "$SKYFOLD_OUT/source-sha256.txt"
          bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Correct the failed camera-to-ring relationship without remodelling
        run: |
          set -euo pipefail
          R08B_MODE=build /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r08-context/skyfold-r08.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r08_refine_frame.py > "$SKYFOLD_OUT/build.log" 2>&1
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r08b-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r08b-context
          git commit -m "R08B low-axial source and preserved environment; no visual approval"
          git push origin HEAD
      - name: Render actual low-axis framing and end-of-motion regression
        run: |
          set -euo pipefail
          R08B_MODE=probe /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r08b.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/r08_refine_frame.py > "$SKYFOLD_OUT/render.log" 2>&1
      - name: Preserve actual outputs and failures
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT']);p.mkdir(parents=True,exist_ok=True)
          files={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.iterdir() if f.is_file()}
          assert sum(r['bytes'] for r in files.values())<100000000
          (p/'DELIVERY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          B=evidence/skyfold-r08b-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [ "$(git branch --show-current)" != "$B" ]; then git switch -c "$B"; fi
          git add workspaces/skyfold-dock/output/r08b-context
          git diff --cached --quiet || git commit -m "R08B actual context observations and exact logs; review pending"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r08b-context-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r08b-context
            workspaces/skyfold-dock/r08_refine_frame.py
            workspaces/skyfold-dock/r08_inhabited_flight.py
            workspaces/skyfold-dock/r06_flight.py
            workspaces/skyfold-dock/provision.sh
          retention-days: 1
          if-no-files-found: error
