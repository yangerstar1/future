name: Chiron sapphire production evidence
on:
  push:
    branches: [codex/chiron-sapphire-web]
    paths: ['workspaces/chiron-sapphire-web/**', '.github/workflows/chiron-production.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chiron-r05-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/codex/chiron-sapphire-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build the immutable checkout and verify actual mechanical geometry
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          node tools/geometry-audit.mjs
          git rev-parse HEAD > evidence/R05/SOURCE-COMMIT.txt
          uname -a > evidence/R05/RUNNER.txt
          node --version >> evidence/R05/RUNNER.txt
          git -C ../.. archive --format=tar HEAD workspaces/chiron-sapphire-web .github/workflows/chiron-production.yml | gzip > /tmp/chiron-readable-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: |
            workspaces/chiron-sapphire-web/dist/
            workspaces/chiron-sapphire-web/evidence/R04/geometry-audit/
            workspaces/chiron-sapphire-web/evidence/R05/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chiron-r05-source-${{ github.sha }}
          path: /tmp/chiron-readable-source.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Archive locked build dependencies for offline reproduction
        run: |
          mkdir -p /tmp/chiron-toolchain
          npm ls --all --json > /tmp/chiron-toolchain/npm-tree.json
          cp package-lock.json /tmp/chiron-toolchain/package-lock.json
          node --version > /tmp/chiron-toolchain/node-version.txt
          tar -czf /tmp/chiron-toolchain/node_modules-linux-x64.tar.gz node_modules
          sha256sum /tmp/chiron-toolchain/node_modules-linux-x64.tar.gz > /tmp/chiron-toolchain/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chiron-locked-toolchain-${{ github.sha }}
          path: /tmp/chiron-toolchain/
          retention-days: 3
          if-no-files-found: error
  observe:
    if: ${{ !contains(github.event.head_commit.message, '[health-check]') && !contains(github.event.head_commit.message, '[route-only]') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: workspaces/chiron-sapphire-web
      - name: Install locked renderer and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: HTTP multi-view observation and editable GLB round trip
        run: xvfb-run -a node tools/craft-observe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-visual-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/evidence/R05/visual/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-assets-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/assets/
          retention-days: 14
  regression:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-check]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: workspaces/chiron-sapphire-web
      - name: Install locked renderer and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Full HTTP ordinary-UI regression, 100 steps and 50 assembly cycles
        env:
          CHIRON_SMALL: '1'
        run: xvfb-run -a node tools/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-regression-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/evidence/R05/
          retention-days: 14
          if-no-files-found: error
  health:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-check]') || contains(github.event.head_commit.message, '[health-check]') || (contains(github.event.head_commit.message, '[route-check]') && !contains(github.event.head_commit.message, '[route-only]'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: workspaces/chiron-sapphire-web
      - name: Install locked renderer and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Actual HTTP graphic failure, retry, visibility and touch
        run: xvfb-run -a node tools/health-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-health-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/evidence/R05/health/
          retention-days: 14
          if-no-files-found: error
  performance:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-check]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: workspaces/chiron-sapphire-web
      - name: Install locked renderer and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Software-renderer distribution; never physical-GPU qualification
        run: xvfb-run -a node tools/performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-performance-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/evidence/R05/performance/
          retention-days: 14
          if-no-files-found: error

  route:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[route-check]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspaces/chiron-sapphire-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: chiron-r05-build-${{ github.sha }}
          path: workspaces/chiron-sapphire-web
      - name: Install locked renderer and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Final HTTP continuous user route and video
        run: xvfb-run -a node tools/route-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiron-r05-route-${{ github.sha }}
          path: workspaces/chiron-sapphire-web/evidence/R05/route/
          retention-days: 14
          if-no-files-found: error
