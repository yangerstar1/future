name: Chiron R03 robust solid diagnostic tool
on:
  push:
    branches: [codex/chiron-craft-r03]
    paths: ['.github/workflows/chiron-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact public CPython 3.13 wheel; verify published SHA256
        run: |
          mkdir -p /tmp/chiron-solid-wheel
          python3 -m pip download manifold3d==3.5.3 --python-version 313 --abi cp313 --implementation cp --platform manylinux_2_27_x86_64 --only-binary=:all: --no-deps -d /tmp/chiron-solid-wheel
          cd /tmp/chiron-solid-wheel
          echo '239b300cd1cbe9f8c0397863d2f657800f9c3212316a7e0d60554bf81e4c3617  manifold3d-3.5.3-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl' | sha256sum --check
          printf 'Offline geometry diagnostic only. No change to production runtime or visual qualification.\n' > SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chiron-r03-manifold-wheel
          path: /tmp/chiron-solid-wheel/
          retention-days: 7
          if-no-files-found: error
