name: Glasshouse G4 coast water optics and distance refinement
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [.github/workflows/glasshouse-g4-ocean-optics.yml]
permissions:
  contents: write
jobs:
  correct-saved-water:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.persist.outputs.evidence }}
    defaults:
      run:
        shell: bash
    env:
      OUT: workspaces/glasshouse-terminus/output/g4-coast-r03
      BLENDER_PROVISION_PROFILE: render-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact coast parent and record one evidence-based request
        timeout-minutes: 3
        run: |
          git fetch --depth=1 origin 071ba6959335f094209fbc4537d2ce2b1246d2dc
          git archive FETCH_HEAD workspaces/glasshouse-terminus/output/g4-coast-r02 | tar -x
          python3 workspaces/glasshouse-terminus/coast_master_transport.py restore workspaces/glasshouse-terminus/output/g4-coast-r02
          echo 'b8cea93e7511088f418afbc843b66ddd4dcd0e82f34860b192150341f258ef64  workspaces/glasshouse-terminus/output/g4-coast-r02/g4-full-scene-candidate.blend' | sha256sum --check
          mkdir -p "$OUT"
          printf 'One evidence-based water correction. Actual native C01/C02 from artifact10029611593 show sparse distant displacement stripes and diffuse clay-like water. Change only sea geometry/owned shaders and geometry node group; preserve rocks/building/train/rain/materials/cameras/lights/exposure. Source15min no rendering; renderer40min, production33min,reserve7min. Public standard runner,single production renderer,external spend0,total downloads1.5GB,disk8GB,evidence180MB. Native spectral sea/proximity foam is not coast impact fluid simulation. No G4 acceptance.\n' > "$OUT/FINITE-REQUEST.txt"
          python3 -m py_compile workspaces/glasshouse-terminus/refine_g4_ocean_optics.py
      - name: Validate installed native prerequisites, no unrelated video-package downloads
        timeout-minutes: 5
        run: bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee "$OUT/provision-source.log"
      - name: Correct only owned water and check far geometry, closure and replay
        timeout-minutes: 6
        env:
          G4_OCEAN_MODE: build
        run: |
          blender -b workspaces/glasshouse-terminus/output/g4-coast-r02/g4-full-scene-candidate.blend -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/refine_g4_ocean_optics.py 2>&1 | tee "$OUT/build.log"
          test "$(du -sb workspaces/glasshouse-terminus | cut -f1)" -lt 8000000000
      - name: Persist full-quality corrected source before images
        id: persist
        timeout-minutes: 3
        run: |
          python3 workspaces/glasshouse-terminus/coast_master_transport.py publish "$OUT" g4-coast-r03-source | tee "$RUNNER_TEMP/ocean-save.log"
          c=$(sed -n 's/^PERSISTED_EVIDENCE_COMMIT=//p' "$RUNNER_TEMP/ocean-save.log");test -n "$c"
          echo "evidence=$c" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g4-coast-r03-source-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g4-coast-r03
          retention-days: 1
          if-no-files-found: error
  native-water-review:
    needs: correct-saved-water
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: glasshouse-production
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    env:
      OUT: workspaces/glasshouse-terminus/output/g4-coast-r03
      BLENDER_PROVISION_PROFILE: render-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore immutable corrected source after previous production work
        env:
          EVIDENCE: ${{ needs.correct-saved-water.outputs.evidence }}
        run: |
          echo "G4_OCEAN_DEADLINE=$(( $(date +%s) + 33*60 ))" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "$EVIDENCE"
          git archive FETCH_HEAD "$OUT" | tar -x
          python3 workspaces/glasshouse-terminus/coast_master_transport.py restore "$OUT"
          rm -r "$OUT/master-parts"
      - name: Reuse locked native renderer without codec setup
        timeout-minutes: 5
        run: bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee "$OUT/provision-render.log"
      - name: Native fixed original exterior and reverse evidence
        timeout-minutes: 18
        env:
          G4_OCEAN_MODE: exterior
        run: |
          remaining=$((G4_OCEAN_DEADLINE-$(date +%s)));test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-full-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/refine_g4_ocean_optics.py 2>&1 | tee "$OUT/exterior-render.log"
      - name: Early native images for actual same-camera comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-coast-r03-early-${{ github.run_id }}
          path: |
            workspaces/glasshouse-terminus/output/g4-coast-r03/C01-dielectric-coast.png
            workspaces/glasshouse-terminus/output/g4-coast-r03/C02-dielectric-reverse.png
            workspaces/glasshouse-terminus/output/g4-coast-r03/build-report.json
            workspaces/glasshouse-terminus/output/g4-coast-r03/exterior-render-metrics.json
          retention-days: 1
      - name: Original wave and cliff closeups in a fresh process
        timeout-minutes: 20
        env:
          G4_OCEAN_MODE: water
        run: |
          remaining=$((G4_OCEAN_DEADLINE-$(date +%s)));test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-full-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/refine_g4_ocean_optics.py 2>&1 | tee "$OUT/water-render.log"
      - name: Native short moving-wave proof only within remaining budget
        timeout-minutes: 12
        env:
          G4_OCEAN_MODE: motion
        run: |
          remaining=$((G4_OCEAN_DEADLINE-$(date +%s)))
          if [ "$remaining" -gt 180 ]; then
            timeout --signal=TERM --kill-after=10 "${remaining}s" blender -b "$OUT/g4-full-scene-candidate.blend" -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/refine_g4_ocean_optics.py 2>&1 | tee "$OUT/motion-render.log"
          else
            printf 'Native movie not attempted within remaining finite budget; source replay verified but no clip claimed.\n' > "$OUT/motion-not-attempted.txt"
          fi
      - name: Preserve actual image coverage and lossless model, never automatic art pass
        if: always()
        timeout-minutes: 5
        run: |
          python3 workspaces/glasshouse-terminus/coast_master_transport.py prepare "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          r=Path(os.environ['OUT']);files={str(p.relative_to(r)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in r.rglob('*') if p.is_file() and p.name!='DELIVERY.json'}
          assert sum(v['bytes'] for v in files.values())<180000000
          required=['g4-full-scene-candidate.blend','build-report.json','C01-dielectric-coast.png','C02-dielectric-reverse.png','E02-real-water.png','E01-rock-water.png','exterior-reopen-check.json','water-reopen-check.json']
          missing=[n for n in required if not (r/n).is_file()]
          frames=sorted(str(p.relative_to(r)) for p in (r/'motion').glob('*.png')) if (r/'motion').exists() else []
          (r/'DELIVERY.json').write_text(json.dumps({'stage':'G4','revision':'COAST-R03','status':'FOUR_NATIVE_VIEWS_REVIEW_PENDING' if not missing else 'PARTIAL_OR_FAILED_NOT_ART_PASS','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'missing':missing,'native_motion_frames':frames,'native_motion_complete':len(frames)==10,'encoding':'Native PNGs; no codec dependency installed. Any encoded movie must use only these actual frames.','storage':'Full native blend in artifact. Git stores verified lossless parts; restore before canonical manifest verification.','g4_stage_pass':False,'human_acceptance':False},indent=2))
          PY
          python3 workspaces/glasshouse-terminus/coast_master_transport.py publish "$OUT" g4-coast-r03
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g4-coast-r03-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g4-coast-r03
          retention-days: 1
          if-no-files-found: error
