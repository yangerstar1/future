name: Skyfold R02 spatial hierarchy and full observations
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r02.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r02
  cancel-in-progress: false
jobs:
  spatial:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r02
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record source signature and actual runner
        run: |
          set -euo pipefail
          mkdir -p "$SKYFOLD_OUT"
          python3 - <<'PY'
          import json,os,platform,shutil,hashlib,subprocess
          from pathlib import Path
          root=Path('workspaces/skyfold-dock');out=Path(os.environ['SKYFOLD_OUT'])
          files=['revise_r02.py','render_r02.py','build_scene_r01.py','provision.sh']
          r={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'python':platform.python_version(),'cpu_count':os.cpu_count(),'memory':subprocess.check_output(['free','-b'],text=True),'disk':shutil.disk_usage('.')._asdict(),'sources':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files},'budget':{'timeout_minutes':40,'concurrency':1,'paid_services':False},'artistic_status':'NOT_REVIEWED'}
          (out/'environment.json').write_text(json.dumps(r,indent=2));print(json.dumps(r,indent=2))
          PY
      - name: Reuse locked official Blender toolchain
        run: |
          set -euo pipefail
          bash workspaces/skyfold-dock/provision.sh 2>&1 | tee "$SKYFOLD_OUT/provision.log"
      - name: Derive R02 from immutable R01
        timeout-minutes: 10
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/build-time.txt" blender -b workspaces/skyfold-dock/output/r01/skyfold-r01.blend -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/revise_r02.py 2>&1 | tee "$SKYFOLD_OUT/build.log"
      - name: Save recoverable source before rendering
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r02-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r02
          git commit -m "skyfold R02 recoverable source ${GITHUB_RUN_ID}; visual review pending"
          git push origin HEAD
      - name: Render true observations in new Blender process
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/skyfold-r02.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/render_r02.py 2>&1 | tee "$SKYFOLD_OUT/render.log"
      - name: Verify bounded outputs and preserve selected checkpoint evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,struct
          from pathlib import Path
          out=Path(os.environ['SKYFOLD_OUT']);files={}
          for p in out.iterdir():
            if not p.is_file():continue
            assert p.stat().st_size<40000000,p.name
            row={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
            if p.suffix=='.png':
              b=p.read_bytes();assert b[:8]==b'\x89PNG\r\n\x1a\n';row['dimensions']=struct.unpack('>II',b[16:24])
            files[p.name]=row
          total=sum(r['bytes'] for r in files.values());assert total<80000000,total
          (out/'DELIVERY.json').write_text(json.dumps({'candidate':'R02_SPATIAL_STUDY','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'total_bytes':total,'visual_status':'REVIEW_REQUIRED','auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH=evidence/skyfold-r02-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [ "$(git branch --show-current)" != "$BRANCH" ]; then git switch -c "$BRANCH"; fi
          for f in skyfold-r02.blend BUILD-MANIFEST.json DELIVERY.json OBSERVATIONS.json environment.json build-time.txt render-time.txt build.log render.log provision.log libraries.log O01_HERO.png O01_SECOND.png O04_CRAFT.png; do
            [ ! -f "$SKYFOLD_OUT/$f" ] || git add "workspaces/skyfold-dock/output/r02/$f"
          done
          git diff --staged --quiet || git commit -m "skyfold R02 selected checkpoint and exact observations ${GITHUB_RUN_ID}; not qualified"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r02-observations-${{ github.run_id }}
          path: |
            workspaces/skyfold-dock/output/r02
            workspaces/skyfold-dock/revise_r02.py
            workspaces/skyfold-dock/render_r02.py
            workspaces/skyfold-dock/build_scene_r01.py
            workspaces/skyfold-dock/provision.sh
            workspaces/skyfold-dock/R02-INTERVENTION.md
            workspaces/skyfold-dock/output/r01/skyfold-r01.blend
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
