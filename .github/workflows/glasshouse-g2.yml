name: Glasshouse G2 complete whitebox
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [workspaces/glasshouse-terminus/g2-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glasshouse-production
  cancel-in-progress: false
jobs:
  whitebox:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check prior visual gate and bounded recovery request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('workspaces/glasshouse-terminus/g2-request.json').read_text())
          assert request['stage']=='G2'
          assert request['g1_visual_gate']=='PROCEED_TO_WHITEBOX'
          assert request['external_spend_usd']==0
          assert 0<request['job_minutes']<=60
          assert request['evidence_run_id']
          assert request['reserve_for_save_and_retrieval_minutes']>=18
          print(json.dumps(request,indent=2))
          PY
      - name: Install validated tools in ephemeral standard runner
        timeout-minutes: 8
        run: |
          mkdir -p workspaces/glasshouse-terminus/output/g2
          bash workspaces/glasshouse-terminus/provision.sh 2>&1 | tee workspaces/glasshouse-terminus/output/g2/provision.log
      - name: Build complete A-E geometry and fixed Cycles C01-C09 observations
        timeout-minutes: 15
        run: |
          blender -b --factory-startup -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/build_g2.py 2>&1 | tee workspaces/glasshouse-terminus/output/g2/build.log
      - name: Return fixed-view contact evidence before motion rendering
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-fixed-views-${{ github.run_id }}
          path: |
            workspaces/glasshouse-terminus/output/g2/C*.png
            workspaces/glasshouse-terminus/output/g2/render-metrics.json
            workspaces/glasshouse-terminus/output/g2/layout-and-route.json
          retention-days: 1
          if-no-files-found: error
      - name: Persist fixed-view checkpoint without workflow files
        timeout-minutes: 3
        run: |
          bash workspaces/glasshouse-terminus/publish_evidence.sh workspaces/glasshouse-terminus/output/g2 g2-fixed
      - name: Reopen Cycles master and render native low-cost whitebox movement
        timeout-minutes: 17
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' blender -b workspaces/glasshouse-terminus/output/g2/g2-complete-whitebox.blend -t 4 --python-exit-code 1 -P workspaces/glasshouse-terminus/render_animatic.py 2>&1 | tee workspaces/glasshouse-terminus/output/g2/animatic.log
          ffmpeg -y -framerate 10 -i workspaces/glasshouse-terminus/output/g2/animatic-frames/%04d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -metadata comment='G2 WORKBENCH WHITEBOX PREVIS: native 640x360 10FPS, not final 4K30 film or material evidence' workspaces/glasshouse-terminus/output/g2/whitebox-28s.mp4
          ffprobe -v error -show_streams -show_format -of json workspaces/glasshouse-terminus/output/g2/whitebox-28s.mp4 > workspaces/glasshouse-terminus/output/g2/animatic-media.json
      - name: Preserve observations with the existing contents-only publisher
        if: always()
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,hashlib,shutil
          root=Path('workspaces/glasshouse-terminus/output/g2');root.mkdir(parents=True,exist_ok=True)
          src=root/'animatic-frames';selected=root/'continuity-frames';selected.mkdir(exist_ok=True)
          indices=set(range(0,280,20))|set(range(95,121,5))|set(range(130,221,5))|{0,29,30,69,70,129,130,219,220,279}
          if src.exists():
              for i in sorted(indices):
                  p=src/f'{i:04d}.png'
                  if p.is_file():shutil.copy2(p,selected/p.name)
              if (root/'whitebox-28s.mp4').is_file():shutil.rmtree(src)
          files={};total=0
          for p in root.rglob('*'):
              if p.is_file():
                  total+=p.stat().st_size
                  assert p.stat().st_size<90_000_000,str(p)+' exceeds per-file recovery bound'
                  files[str(p.relative_to(root))]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          assert total<180_000_000,'Transfer budget exceeded; do not silently drop evidence'
          complete=(root/'whitebox-28s.mp4').is_file() and (root/'evaluated-space-check.json').is_file() and len(list(root.glob('C*.png')))>=9
          (root/'DELIVERY.json').write_text(json.dumps({'stage':'G2','status':'WHITEBOX_REVIEW_PENDING_NOT_FINAL_ART' if complete else 'PARTIAL_RECOVERY_NOT_A_PASS','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'prior_failed_run':33930258391,'g1_browser_gate':'BLOCKED_UNCHANGED','files':files,'total_bytes':total},indent=2))
          PY
          bash workspaces/glasshouse-terminus/publish_evidence.sh workspaces/glasshouse-terminus/output/g2 g2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g2-whitebox-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g2
          retention-days: 1
          if-no-files-found: error
