name: Glasshouse G1 artifact recovery
on:
  push:
    branches: [codex/glasshouse-terminus]
    paths: [.github/workflows/glasshouse-g1-recovery.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: glasshouse-production
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover verified artifact and inspect only selected reusable asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,os,hashlib,zipfile,io,json,time
          from pathlib import Path
          class RedirectWithoutCredentials(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected:redirected.remove_header('Authorization')
                  return redirected
          url='https://api.github.com/repos/yangerstar1/future/actions/artifacts/9958006611/zip'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'GlasshouseTerminus-Recovery/1.0'})
          with urllib.request.build_opener(RedirectWithoutCredentials()).open(req,timeout=90) as r:data=r.read(115000001)
          actual={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          print('Actual archive',json.dumps(actual))
          # Reverified against current GitHub artifact metadata AND mounted ZIP bytes.
          assert actual=={'bytes':72606208,'sha256':'c968a995843ccbcbe04a3d4ef84ea7fef903fa816e6bebc426b66f617c5d50ad'}
          root=Path('workspaces/glasshouse-terminus/output/g1').resolve();root.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert sum(i.file_size for i in z.infolist())<180000000
              for i in z.infolist():
                  target=(root/i.filename).resolve()
                  assert target.is_relative_to(root) and not Path(i.filename).is_absolute()
                  assert i.file_size<90000000
              z.extractall(root)
          assert hashlib.sha256((root/'g1-risk-study.blend').read_bytes()).hexdigest()=='4c53a851663ff3eac46f7c9e362d9bc3145d07e70d1df813dec25ea15915a4b3'
          delivery=json.loads((root/'DELIVERY.json').read_text())
          assert delivery['run_id']=='33928926761'
          assert delivery['source_sha']=='18c044402aaa01a358b541c58d92e181236bffdd'
          (root/'RECOVERY.json').write_text(json.dumps({'original_run':33928926761,'artifact':9958006611,'archive':actual,'recovery_run':os.environ['GITHUB_RUN_ID'],'status':'Recovered actual candidate; browser remains BLOCKED; not final artwork'},indent=2))
          dest=root/'selected-asset-metadata';dest.mkdir(exist_ok=True)
          for asset in ['GreenChair_01','potted_plant_01']:
              for kind in ['info','files']:
                  req=urllib.request.Request('https://api.polyhaven.com/'+kind+'/'+asset,headers={'User-Agent':'GlasshouseTerminus-Future/1.0 (https://github.com/yangerstar1/future; selected-asset-build)','Referer':'https://github.com/yangerstar1/future'})
                  with urllib.request.urlopen(req,timeout=40) as r:blob=r.read(3000001)
                  assert len(blob)<3000000
                  parsed=json.loads(blob)
                  (dest/(asset+'-'+kind+'.json')).write_text(json.dumps(parsed,indent=2))
                  if kind=='files':print(asset,'selected glTF variants',json.dumps(parsed.get('gltf',{})))
                  time.sleep(.5)
          PY
      - name: Publish data-only reference within contents permission, not workflow edits
        run: bash workspaces/glasshouse-terminus/publish_evidence.sh workspaces/glasshouse-terminus/output/g1 g1-recovered
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovered-asset-metadata-${{ github.run_id }}
          path: workspaces/glasshouse-terminus/output/g1/selected-asset-metadata
          retention-days: 1
          if-no-files-found: warn
