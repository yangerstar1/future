name: Skyfold R08B native 2560 observation
on:
  push:
    branches: [codex/skyfold-dock]
    paths: [.github/workflows/skyfold-r08-context.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfold-r08-context
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yangerstar1/future' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SKYFOLD_OUT: ${{ github.workspace }}/workspaces/skyfold-dock/output/r08b-native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore inspected immutable low-axis scene and existing renderer
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a609a7535d95fcaa01613d9e2a510d77aece5845
          git restore --source=FETCH_HEAD -- workspaces/skyfold-dock/output/r08b-context/skyfold-r08b.blend workspaces/skyfold-dock/output/r08b-context/BUILD-MANIFEST.json
          echo 'e714356e215b7e857adaf29c224cb8d9261ab094f74cfb5e11ada45e0e05d877  workspaces/skyfold-dock/output/r08b-context/skyfold-r08b.blend' | sha256sum -c
          mkdir -p "$SKYFOLD_OUT/source" "$SKYFOLD_OUT/scripts"
          cp workspaces/skyfold-dock/output/r08b-context/{skyfold-r08b.blend,BUILD-MANIFEST.json} "$SKYFOLD_OUT/source/"
          cp workspaces/skyfold-dock/{r08_refine_frame.py,r08_inhabited_flight.py,render_r08_snapshot.py,r06_flight.py,provision.sh} "$SKYFOLD_OUT/scripts/"
          cp .github/workflows/skyfold-r08-context.yml "$SKYFOLD_OUT/scripts/"
          python3 -m py_compile workspaces/skyfold-dock/render_r08_snapshot.py
          { date -u; git rev-parse HEAD; free -b; df -B1 .; } > "$SKYFOLD_OUT/environment.txt"
          bash workspaces/skyfold-dock/provision.sh > "$SKYFOLD_OUT/provision.log" 2>&1
      - name: Render native 2560 image and uncomposited control
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$SKYFOLD_OUT/render-time.txt" blender -b "$SKYFOLD_OUT/source/skyfold-r08b.blend" -t 4 --python-exit-code 1 -P workspaces/skyfold-dock/render_r08_snapshot.py > "$SKYFOLD_OUT/render.log" 2>&1
      - name: Preserve exact rendered output and any failure
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SKYFOLD_OUT']);p.mkdir(parents=True,exist_ok=True)
          files={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          assert sum(r['bytes'] for r in files.values())<100000000
          (p/'DELIVERY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files,'auto_qualified':False},indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/skyfold-r08b-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git add workspaces/skyfold-dock/output/r08b-native
          git commit -m "R08B native-size observation, source and logs; artistic qualification not implied"
          git push origin HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skyfold-r08b-native-${{ github.run_id }}
          path: workspaces/skyfold-dock/output/r08b-native
          retention-days: 1
          if-no-files-found: error
